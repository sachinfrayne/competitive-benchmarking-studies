engine: "elasticsearch"

elasticsearch:
  url_env: "ELASTICSEARCH_URL"
  user_env: "ELASTICSEARCH_USER"
  password_env: "ENGINE_PASSWORD"
  query_dump_directory: ./query-dumps

dataset: "wiki-dpr-e5-768"

datasets:
  wiki-dpr-e5-768:
    type: "parquet"
    index_name: "wiki-dpr-e5-768"
    vector_size: 768
    distance: "cosine"
    schema_name: "wiki-dpr-es-768-knn"
    query_name: "wiki-dpr-es-768-knn"
    path:
      data_path: "datasets/wiki-dpr-e5-768/data.parquet"
      queries_path: "datasets/wiki-dpr-e5-768/queries.parquet"
      data_url_env: "DATASET_DATA_URL"
      queries_url_env: "DATASET_QUERIES_URL"
    data_mapping:
      id_field: "id"
      vector_field: "embedding"
    queries_mapping:
      query_vector_field: "embedding"
      ground_truth_field: "closest_ids"
    param_groups:
      recall@100:
        - { size: 100, k: 10, visit_percentage: 0.1, oversample: 3 }
        - { size: 100, k: 20, visit_percentage: 0.2, oversample: 3 }
        - { size: 100, k: 30, visit_percentage: 0.3, oversample: 3 }
        - { size: 100, k: 40, visit_percentage: 0.4, oversample: 3 }
        - { size: 100, k: 50, visit_percentage: 0.5, oversample: 3 }
        - { size: 100, k: 60, visit_percentage: 0.6, oversample: 3 }
        - { size: 100, k: 70, visit_percentage: 0.7, oversample: 3 }
        - { size: 100, k: 80, visit_percentage: 0.8, oversample: 3 }
        - { size: 100, k: 90, visit_percentage: 0.9, oversample: 3 }
        - { size: 100, k: 100, visit_percentage: 1, oversample: 3 }
        - { size: 100, k: 150, visit_percentage: 1.5, oversample: 3 }
        - { size: 100, k: 200, visit_percentage: 2, oversample: 3 }
        - { size: 100, k: 250, visit_percentage: 2.5, oversample: 3 }
        - { size: 100, k: 300, visit_percentage: 3, oversample: 3 }
        - { size: 100, k: 350, visit_percentage: 3.5, oversample: 3 }
        - { size: 100, k: 400, visit_percentage: 4, oversample: 3 }
        - { size: 100, k: 450, visit_percentage: 4.5, oversample: 3 }
        - { size: 100, k: 500, visit_percentage: 5, oversample: 3 }
        - { size: 100, k: 550, visit_percentage: 5.5, oversample: 3 }
        - { size: 100, k: 600, visit_percentage: 6, oversample: 3 }
        - { size: 100, k: 650, visit_percentage: 6.5, oversample: 3 }
        - { size: 100, k: 700, visit_percentage: 7, oversample: 3 }
        - { size: 100, k: 750, visit_percentage: 7.5, oversample: 3 }
        - { size: 100, k: 800, visit_percentage: 8, oversample: 3 }
        - { size: 100, k: 850, visit_percentage: 8.5, oversample: 3 }
        - { size: 100, k: 900, visit_percentage: 9, oversample: 3 }
        - { size: 100, k: 1000, visit_percentage: 10, oversample: 3 }

evaluation:
  warmup_workers: 16
  measurement_workers: 16
  warmup_rounds: 3
  measurement_rounds: 1
  run_id: "es-9.3-vs-qd-1.17-vector-search-5"

output:
  sinks:
    - type: "elasticsearch"
      config:
        url_env: "RESULTS_ES_URL"
        user_env: "RESULTS_ES_USER"
        password_env: "RESULTS_ES_PASSWORD"
        index: "jingra-results"
