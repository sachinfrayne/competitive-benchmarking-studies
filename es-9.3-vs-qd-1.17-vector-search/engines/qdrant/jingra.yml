engine: "qdrant"

qdrant:
  url_env: "QDRANT_URL"
  api_key_env: "ENGINE_PASSWORD"
  vector_field: "embedding"
  grpc_timeout_seconds: 300
  query_dump_directory: ./query-dumps

dataset: "wiki-dpr-e5-768"

datasets:
  wiki-dpr-e5-768:
    type: "parquet"
    index_name: "wiki-dpr-e5-768"
    vector_size: 768
    distance: "cosine"
    schema_name: "wiki-dpr-e5-768-knn"
    query_name: "wiki-dpr-e5-768-knn"
    path:
      data_path: "datasets/wiki-dpr-e5-768/data.parquet"
      queries_path: "datasets/wiki-dpr-e5-768/queries.parquet"
      data_url_env: "DATASET_DATA_URL"
      queries_url_env: "DATASET_QUERIES_URL"
    data_mapping:
      id_field: "id"
      vector_field: "embedding"
    queries_mapping:
      query_vector_field: "embedding"
      ground_truth_field: "closest_ids"
    param_groups:
      recall@100:
        - { size: 100, hnsw_ef: 10, oversampling: 1 }
        - { size: 100, hnsw_ef: 20, oversampling: 2 }
        - { size: 100, hnsw_ef: 30, oversampling: 3 }
        - { size: 100, hnsw_ef: 40, oversampling: 4 }
        - { size: 100, hnsw_ef: 50, oversampling: 5 }
        - { size: 100, hnsw_ef: 60, oversampling: 6 }
        - { size: 100, hnsw_ef: 70, oversampling: 7 }
        - { size: 100, hnsw_ef: 80, oversampling: 8 }
        - { size: 100, hnsw_ef: 90, oversampling: 9 }
        - { size: 100, hnsw_ef: 100, oversampling: 10 }
        - { size: 100, hnsw_ef: 200, oversampling: 20 }
        - { size: 100, hnsw_ef: 300, oversampling: 30 }
        - { size: 100, hnsw_ef: 400, oversampling: 40 }
        - { size: 100, hnsw_ef: 500, oversampling: 50 }
        - { size: 100, hnsw_ef: 600, oversampling: 60 }
        - { size: 100, hnsw_ef: 700, oversampling: 70 }
        - { size: 100, hnsw_ef: 800, oversampling: 80 }
        - { size: 100, hnsw_ef: 900, oversampling: 90 }
        - { size: 100, hnsw_ef: 1000, oversampling: 100 }
        - { size: 100, hnsw_ef: 2000, oversampling: 200 }
        - { size: 100, hnsw_ef: 3000, oversampling: 300 }
        - { size: 100, hnsw_ef: 4000, oversampling: 400 }
        - { size: 100, hnsw_ef: 5000, oversampling: 500 }
        - { size: 100, hnsw_ef: 6000, oversampling: 600 }
        - { size: 100, hnsw_ef: 7000, oversampling: 700 }
        - { size: 100, hnsw_ef: 8000, oversampling: 800 }
        - { size: 100, hnsw_ef: 9000, oversampling: 900 }
        - { size: 100, hnsw_ef: 10000, oversampling: 1000 }

evaluation:
  warmup_workers: 16
  measurement_workers: 16
  warmup_rounds: 3
  measurement_rounds: 1

output:
  sinks:
    - type: "elasticsearch"
      config:
        url_env: "RESULTS_ES_URL"
        user_env: "RESULTS_ES_USER"
        password_env: "RESULTS_ES_PASSWORD"
        index: "jingra-results"
