# Jingra Analysis Configuration
# Analyzes benchmark results from ES vs Qdrant comparison

engine: elasticsearch

# Results cluster configuration (where benchmark results are stored)
analysis:
  # Run ID to analyze (update this to match your actual run ID)
  run_id: "jingra-es-9.4-vs-qd-1.17-vector-search-5"

  # Engines to compare (baseline vs target)
  engines:
    - elasticsearch
    - qdrant

  # Elasticsearch cluster where benchmark results are stored
  results_cluster:
    url_env: RESULTS_ES_URL
    user_env: RESULTS_ES_USER
    password_env: RESULTS_ES_PASSWORD
    index: jingra-results

  # Output directory for CSV files and plots
  # This will be mounted as a Docker volume
  output_directory: /output

  # Latency metrics to include as columns in the comparison CSV
  # Each metric becomes a separate column in the output
  # Options: server_latency_median, latency_median, server_latency_p95, latency_p95, etc.
  # Use server_latency_* to prefer server-side metrics with fallback to client
  latency_metrics:
    - latency_avg
    - latency_median
    - latency_p90
    - latency_p95
    - latency_p99
    - server_latency_avg
    - server_latency_median
    - server_latency_p90
    - server_latency_p95
    - server_latency_p99

  # Generate plots (requires XChart - Phase 6)
  # Set to false for now since plot generation is deferred
  generate_plots: true
